[req]
distinguished_name = req_distinguished_name
x509_extensions = v3_req
prompt = no

[req_distinguished_name]
C = US
ST = NY
L = SMW
O = ACME
OU = ACMEU
CN = default.svc.cluster.local

[v3_req]
# Mark the self-signed cert as a CA so clients that mount it as a trusted CA
# (e.g. the IBM COS S3 CSI controller) can verify MinIO's TLS. Without CA:TRUE,
# x509 rejects it: "parent certificate cannot sign this kind of certificate".
basicConstraints = critical, CA:TRUE
keyUsage = critical, digitalSignature, keyEncipherment, keyCertSign
extendedKeyUsage = serverAuth
subjectAltName = @alt_names

[alt_names]
IP.1 = 127.0.0.1
DNS.1 = localhost
DNS.2 = default.svc.cluster.local
DNS.3 = minio.default.svc.cluster.local
