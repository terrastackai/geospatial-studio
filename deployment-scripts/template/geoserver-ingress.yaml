apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: geofm-geoserver
  namespace: default
  labels:
    app: geofm-geoserver
  annotations:
    haproxy-ingress.github.io/hsts: "true"
    haproxy-ingress.github.io/hsts-max-age: "31536000"
    haproxy-ingress.github.io/timeout-server: "900s"
spec:
  ingressClassName: haproxy
  rules:
    - host: geofm-geoserver.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: geofm-geoserver
                port:
                  number: 3000

